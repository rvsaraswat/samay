services:
  ghadi:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "${GHADI_PORT:-31873}:8080"
    environment:
      PORT: "8080"
      SE_EPHE_PATH: /app/ephe
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
