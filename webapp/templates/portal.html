<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ghadi</title>
<style>
:root{--bg:#050816;--panel:#0d1428;--line:#253252;--ink:#e8edf8;--muted:#98a6c0;--gold:#d4af37;--cyan:#49d6c8;--blue:#60a5fa;--red:#ef8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1d2756,#050816 48%);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:20px 28px 60px}.nav{display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0 20px;overflow:auto}.nav a{white-space:nowrap;color:var(--muted);font-size:.86rem}.nav a:hover,.nav .brand{color:var(--gold)}.brand{font-weight:800;font-size:1.45rem;letter-spacing:.08em;margin-right:auto}.hero{padding:55px 0 28px}.eyebrow{color:var(--cyan);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.hero h1{font:700 clamp(2.3rem,6vw,4.8rem)/1 Georgia,serif;margin:12px 0}.hero p{color:var(--muted);max-width:650px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.controls input,.controls button{background:#111b34;border:1px solid var(--line);color:var(--ink);padding:11px;border-radius:4px}.controls button{background:var(--gold);color:#101426;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:rgba(13,20,40,.9);border:1px solid var(--line);padding:20px;border-radius:6px}.card h2{color:var(--gold);font:700 1.35rem Georgia,serif;margin:0 0 8px}.card p{color:var(--muted);margin:0}.card a{display:block;color:var(--cyan);margin-top:16px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:12px 0}.item b{color:var(--cyan)}.item span{color:var(--muted)}.error{color:var(--red)}@media(max-width:700px){.shell{padding:14px}.cards{grid-template-columns:1fr}.hero{padding-top:35px}.item{display:block}.item span{display:block;margin-top:3px}}
</style></head>
<body><div class="shell"><nav class="nav"><a class="brand" href="/today">GHADI</a><a href="/today">Today</a><a href="/cosmos">Cosmos</a><a href="/time-machine">Time Machine</a><a href="/festivals">Festivals</a><a href="/muhurtas">Muhurtas</a><a href="/events">Events</a><a href="/knowledge">Knowledge</a><a href="/birth-snapshot">Birth Snapshot</a><a href="/settings">Settings</a></nav><main id="app"></main></div>
<script>
const mode={{ mode|tojson }};const app=document.getElementById('app');const topics=['tithi','nakshatra','yoga','karana','panchanga','ayanamsha','muhurta'];const today=new Date().toISOString().slice(0,10);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shell(kicker,title,copy,body){app.innerHTML=`<header class="hero"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${copy}</p></header>${body}`}
async function festivals(){shell('Observed dates','Festival calendar','Explore dates resolved by the Drik festival rules for a real location.','<div class="controls"><input id="month" type="month" value="'+today.slice(0,7)+'"><input id="city" value="New Delhi, IN"><button id="load">Load month</button></div><div class="card"><div id="results">Choose a month to load festivals.</div></div>');async function load(){const [year,month]=$('month').value.split('-');const r=await fetch(`/api/cosmic/month/${month}?year=${year}&city=${encodeURIComponent($('city').value)}`);const d=await r.json();$('results').innerHTML=d.festivals.length?'<div class="list">'+d.festivals.map(x=>`<div class="item"><b>${esc(x.name)}</b><span>${esc(x.date)}</span></div>`).join('')+'</div>':'<p>No resolved festival records for this month.</p>'}$('load').onclick=load;load()}
async function events(){shell('Astronomical rhythm','Events','A normalized event stream from Panchanga transitions and festival rules.','<div class="controls"><input id="date" type="date" value="'+today+'"><input id="city" value="New Delhi, IN"><button id="load">Load events</button></div><div class="card"><div id="results"></div></div>');async function load(){const r=await fetch(`/api/cosmic/events?date=${$('date').value}&city=${encodeURIComponent($('city').value)}`);const d=await r.json();$('results').innerHTML='<div class="list">'+d.events.map(x=>`<div class="item"><b>${esc(x.type)} · ${esc(x.name)}</b><span>${esc(x.ends||x.date||'')}</span></div>`).join('')+'</div>'}$('load').onclick=load;load()}
async function birth(){shell('Personal sky','Birth Cosmic Snapshot','Enter a local date, time, and place to reconstruct the Panchanga and planetary positions at birth.','<div class="controls"><input id="birth" type="datetime-local" value="'+today+'T12:00"><input id="city" value="New Delhi, IN"><button id="load">Generate snapshot</button></div><div id="results" class="cards"></div>');async function load(){const r=await fetch(`/api/cosmic/birth?datetime=${$('birth').value}&city=${encodeURIComponent($('city').value)}`);const d=await r.json();if(!r.ok){$('results').innerHTML='<p class="error">'+esc(d.error)+'</p>';return}$('results').innerHTML='<div class="card"><h2>At birth</h2><p>'+esc(d.birth.datetime)+'</p><p>'+esc(d.location.name)+'</p></div><div class="card"><h2>'+esc(d.panchanga.tithi[0].name)+'</h2><p>'+esc(d.panchanga.nakshatra[0].name)+'</p><p>'+esc(d.panchanga.masa)+'</p></div><div class="card"><h2>Planets</h2><p>'+d.planets.length+' engine positions</p><a href="/cosmos">Open cosmic view →</a></div>'}$('load').onclick=load;load()}
async function knowledge(){shell('Field notes','Knowledge','Short explanations grounded in the same concepts the engine calculates.','<div class="cards" id="topics"></div>');const d=await (await fetch('/api/knowledge')).json();$('topics').innerHTML=d.topics.map(x=>`<article class="card"><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p><a href="/knowledge/${x.slug}">Explore →</a></article>`).join('')}
function muhurtas(){shell('Daily windows','Muhurtas','Explore the sunrise-anchored windows already produced by the authoritative day engine.','<div class="card"><p>Choose a date in the Cosmos view to inspect Rahu Kalam, Durmuhurta, Varjyam, and Pratah Sandhya. These windows are not approximated in the browser.</p><a href="/cosmos">Open today\'s windows →</a></div>')}
function settings(){shell('Personalization','Settings','Choose the location and coordinate convention used across Ghadi.','<div class="card"><p>Location, month system, and ayanamsha are request-level settings today. They are intentionally explicit so a snapshot is reproducible.</p><a href="/cosmos">Open cosmic settings →</a></div>')}
async function topic(){const slug=location.pathname.split('/').pop();const r=await fetch('/api/knowledge/'+slug);const d=await r.json();if(!r.ok){shell('Knowledge','Topic not found','', '<p class="error">'+esc(d.error)+'</p>');return}shell('Knowledge',' '+esc(d.title),esc(d.summary),'<article class="card"><p>'+esc(d.body)+'</p></article>')}
if(location.pathname.startsWith('/knowledge/') )topic();else if(mode==='festivals')festivals();else if(mode==='events')events();else if(mode==='birth-snapshot')birth();else if(mode==='muhurtas')muhurtas();else if(mode==='settings')settings();else knowledge();
function $(id){return document.getElementById(id)}
</script></body></html>
